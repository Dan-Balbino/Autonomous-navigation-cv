<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - Pagina nao encontrada</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background: #0f1115;
        color: #e6e6e6;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 24px;
      }
      .card {
        max-width: 720px;
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 16px;
        padding: 32px;
        text-align: center;
        backdrop-filter: blur(6px);
      }
      h1 {
        margin: 0 0 8px 0;
        font-size: 56px;
        letter-spacing: 2px;
      }
      p {
        margin: 0 0 24px 0;
        color: #b9b9b9;
        font-size: 16px;
        line-height: 1.5;
      }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 8px;
        background: #2a2f3a;
        color: #e6e6e6;
        text-decoration: none;
        border: 1px solid rgba(255, 255, 255, 0.12);
        transition: background 0.2s ease;
      }
      a:hover {
        background: #343a46;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>404</h1>
      <p>Essa expressão Toddy ainda não aprendeu... :(</p>
      <a href="/">Voltar</a>
    </div>
  </body>
</html>
