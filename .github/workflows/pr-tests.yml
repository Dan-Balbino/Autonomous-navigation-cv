name: Pull Request Tests

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

jobs:
  # ── Job 1: verifica erros de sintaxe e imports quebrados ──────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax & fatal errors
        run: ruff check . --select=E9,F63,F7,F82 --output-format=github

  # ── Job 2: testes unitários e de integração ───────────────────────────────
  # Os testes ficam em tests/ (pytest) e rodam igual localmente: `python -m pytest tests`.
  # O ultralytics/PyTorch não é instalado: o detector carrega o YOLO só na primeira
  # predição e os testes não precisam do modelo.
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (OpenCV headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless numpy pyserial flask "qrcode[pil]" pytest

      - name: Run tests
        run: python -m pytest tests -v
