name: Pull Request Tests

on:
  pull_request:
    branches: [main, master, develop]
    types: [opened, synchronize, reopened]

jobs:
  # ── Job 1: verifica erros de sintaxe e imports quebrados ──────────────────
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install ruff
        run: pip install ruff

      - name: Check syntax & fatal errors
        run: ruff check . --select=E9,F63,F7,F82 --output-format=github

  # ── Job 2: testes unitários e de integração ───────────────────────────────
  tests:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system libs (OpenCV headless)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install opencv-python-headless numpy pyserial flask

      # ── PID ────────────────────────────────────────────────────────────────
      - name: "[PID] Calculo proporcional, clamping e setValues"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from PID import PID

          # Proporcional puro
          pid = PID(Kp=2.0, Ki=0.0, Kd=0.0, output_limit=90.0)
          assert pid.update(5.0, dt=0.1) == 10.0, "Kp*error esperado"

          # Erro zero sempre retorna zero (sem integral acumulada)
          pid2 = PID(Kp=1.0, Ki=0.0, Kd=0.0, output_limit=90.0)
          assert pid2.update(0.0) == 0.0, "Erro zero deve gerar saida zero"

          # Clamping: saida limitada pelo output_limit
          pid3 = PID(Kp=10.0, Ki=0.0, Kd=0.0, output_limit=5.0)
          assert pid3.update(100.0) == 5.0,  "Clamp maximo falhou"
          assert pid3.update(-100.0) == -5.0, "Clamp minimo falhou"

          # setValues altera ganhos em tempo de execucao
          pid4 = PID(Kp=1.0, Ki=0.0, Kd=0.0)
          pid4.setValues(3.0, 0.5, 0.1)
          assert pid4.Kp == 3.0 and pid4.Ki == 0.5 and pid4.Kd == 0.1

          # Sem output_limit nao deve clipar
          pid5 = PID(Kp=1.0, Ki=0.0, Kd=0.0)
          assert pid5.update(200.0) == 200.0, "Sem limite nao deve cortar"

          print("PASS  PID")
          EOF

      # ── Lane Detection ─────────────────────────────────────────────────────
      - name: "[LaneDetection] Pipeline com imagens estaticas"
        run: |
          python - <<'EOF'
          import sys, os, cv2, numpy as np
          sys.path.insert(0, ".")
          from vision.lane_detection import lane_detection_pipeline

          ROI_W, ROI_H = 320, 240
          images = [
              "tests/images/pista02.png",
              "tests/images/curva_2.png",
              "tests/images/curva_2_no_right_lane.png",
          ]

          for path in images:
              frame = cv2.imread(path)
              assert frame is not None, f"Imagem nao carregada: {path}"

              h, w = frame.shape[:2]
              cx = w // 2
              upper, lower, y_top, y_bot = 1280, 1280, 263, 541

              pts_src = np.float32([
                  [cx - upper // 2, y_top], [cx + upper // 2, y_top],
                  [cx + lower // 2, y_bot], [cx - lower // 2, y_bot],
              ])
              pts_dst = np.float32([[0, 0], [ROI_W, 0], [ROI_W, ROI_H], [0, ROI_H]])

              M   = cv2.getPerspectiveTransform(pts_src, pts_dst)
              roi = cv2.warpPerspective(frame, M, (ROI_W, ROI_H))

              gray = cv2.cvtColor(roi, cv2.COLOR_BGR2GRAY)
              _, thresh = cv2.threshold(gray, 195, 255, cv2.THRESH_BINARY)
              bird = cv2.cvtColor(thresh, cv2.COLOR_GRAY2BGR)

              error, bird_out, state = lane_detection_pipeline(
                  ROI_H, ROI_W, thresh, bird, last_error=0
              )

              assert isinstance(error, (int, float)), \
                  f"error deve ser numerico, got {type(error)}"
              assert bird_out.shape == (ROI_H, ROI_W, 3), \
                  f"Shape errado: {bird_out.shape}"
              assert isinstance(state, str), \
                  f"state deve ser string, got {type(state)}"

              print(f"PASS  {os.path.basename(path):40s}  error={error:+.1f}  state={state}")
          EOF

      # ── SignDetector ───────────────────────────────────────────────────────
      - name: "[SignDetector] Thresholds por classe, clamping e timer STOP"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from signDetector import SignDetector

          det = SignDetector("model/nonexistent.pt")  # sem modelo YOLO → modo sem inferencia

          # Setters individuais
          det.set_conf_stop(0.7);   assert det._conf_stop == 0.7,  "conf_stop"
          det.set_conf_sg(0.5);     assert det._conf_sg   == 0.5,  "conf_sg"
          det.set_conf_sv(0.6);     assert det._conf_sv   == 0.6,  "conf_sv"
          det.set_min_diag(50);     assert det._min_diag  == 50,   "min_diag"

          # Clamping: valores fora de [0, 1] devem ser normalizados
          det.set_conf_stop(1.5);   assert det._conf_stop == 1.0, "clamp high"
          det.set_conf_stop(-0.1);  assert det._conf_stop == 0.0, "clamp low"
          det.set_min_diag(-10);    assert det._min_diag  == 0,   "diag clamp neg"

          # set_conf global deve alterar os tres simultaneamente
          det.set_conf(0.8)
          assert det._conf_stop == det._conf_sg == det._conf_sv == 0.8, "set_conf global"

          # Sem modelo: _boxes vazia → todas as flags False
          assert det.get_flags() == (False, False, False), "flags sem modelo"

          # Timer de STOP: ao chamar get_flags sem deteccao, timer decrementa
          det._stop_timer = 3
          det.get_flags()
          assert det._stop_timer == 2, "timer decrementa em 1 por chamada"

          # Timer zerado nao decrementa abaixo de zero
          det._stop_timer = 0
          det.get_flags()
          assert det._stop_timer == 0, "timer nao vai negativo"

          print("PASS  SignDetector")
          EOF

      # ── Flask API (messaging_core) ─────────────────────────────────────────
      - name: "[API] GET /api/config — chaves do DETECTOR presentes"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from messaging.messaging_core import app

          client = app.test_client()
          r = client.get("/api/config")
          assert r.status_code == 200, f"status {r.status_code}"
          cfg = r.get_json()

          expected_keys = [
              "DETECTOR_Conf STOP",
              "DETECTOR_Conf Verde",
              "DETECTOR_Conf Vermelho",
              "DETECTOR_Box diagonal",
              "PARÂMETROS DO CARRO_PWM",
              "RETA_Kp", "RETA_Ki", "RETA_Kd",
              "CURVA_Kp", "CURVA_Ki", "CURVA_Kd",
              "IMAGEM_Limiar",
              "running",
          ]
          for key in expected_keys:
              assert key in cfg, f"Chave ausente: {key}"

          print("PASS  GET /api/config")
          EOF

      - name: "[API] POST /api/config — atualiza e persiste valor"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from messaging.messaging_core import app, pop_config_update

          client = app.test_client()

          r = client.post("/api/config", json={"DETECTOR_Conf STOP": 75})
          assert r.status_code == 200
          assert r.get_json()["ok"] is True

          cfg = client.get("/api/config").get_json()
          assert cfg["DETECTOR_Conf STOP"] == 75, "valor nao persistiu"

          # pop_config_update deve sinalizar mudanca e limpar o flag
          updated = pop_config_update()
          assert updated is not None,        "flag deveria estar ativo"
          assert updated["DETECTOR_Conf STOP"] == 75
          assert pop_config_update() is None, "flag deveria estar limpo"

          print("PASS  POST /api/config")
          EOF

      - name: "[API] GET /api/dashboard — telemetria reflete update_state"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from messaging.messaging_core import app, update_state

          client = app.test_client()

          update_state(pwm=40, running=True)
          r = client.get("/api/dashboard")
          assert r.status_code == 200
          d = r.get_json()["data"]
          assert d["tabDashboard_rpm"]   == 120,  f"rpm esperado 120, got {d['tabDashboard_rpm']}"
          assert d["tabDashboard_light"] is True,  "light deveria estar True"

          update_state(pwm=0, running=False)
          d2 = client.get("/api/dashboard").get_json()["data"]
          assert d2["tabDashboard_rpm"]   == 0,    "rpm deve ser 0 com pwm=0"
          assert d2["tabDashboard_light"] is False, "light deve ser False parado"

          print("PASS  GET /api/dashboard")
          EOF

      - name: "[API] POST /api/reset — resposta valida"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          from messaging.messaging_core import app

          client = app.test_client()
          r = client.post("/api/reset")
          # config.json pode nao existir em CI → 404 e esperado; 200 tambem e valido
          assert r.status_code in (200, 404), f"status inesperado: {r.status_code}"
          body = r.get_json()
          assert "ok" in body, "resposta deve ter campo 'ok'"

          print(f"PASS  POST /api/reset  (status={r.status_code})")
          EOF

      # ── Imports gerais ─────────────────────────────────────────────────────
      - name: "[Imports] Todos os modulos importam sem erro"
        run: |
          python - <<'EOF'
          import sys; sys.path.insert(0, ".")
          import importlib

          modules = [
              "PID",
              "signDetector",
              "vision.lane_detection",
              "messaging.messaging_core",
          ]

          for mod in modules:
              importlib.import_module(mod)
              print(f"PASS  import {mod}")
          EOF
